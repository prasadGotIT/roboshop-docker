services:
  catalogue:
    build:
     context: ./catalogue
     dockerfile: Dockerfile
    image: prasadsripathi/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb
  mongodb:
    build: ./mongodb
    image: prasadsripathi/mongodb:v1
    container_name: mongodb
    volumes:
      -mongodb:/data/db
  redis:
    image: redis:7.0
    container_name: redis
    volumes:
      -redis:/data
  mysql:
    build: ./mysql
    image: prasadsripathi/mysql:v1
    container_name: mysql
    volumes:
      - mysql:/var/lib/mysql
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    environment:
       RABBITMQ_DEFAULT_USER: roboshop
       RABBITMQ_DEFAULT_PASS: roboshop123
  user:
    build: ./user
    image: prasadsripathi/user:v1
    container_name: user
    depends_on:
      - mongodb
      - redis
  cart:
    build: ./cart
    image: prasadsripathi/cart:v1
    container_name: cart
    depends_on:
      - redis
      - catalogue
    shipping:
      build: ./shipping
      image: prasadsripathi/shipping:v1
      container_name: shipping
      depends_on:
      - mysql
      - cart
    payment:
      build: ./payment
      image:  prasadsripathi/payment:v1
      container_name: payment
      depends_on:
      - rabbitmq
      - cart
      - user
    frontend:
      build: ./frontend
      image: prasadsripathi/frontend:v1
      container_name: frontend
      ports:
      - "80:80"
      depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - payment
    networks:
      default:
        driver: bridge
        name: roboshop
        external: false
    volumes:
        mongodb:
        redis:
        mysql:
        rabbitmq:

